<style>

.ic{display:block;flex:none;overflow:visible}.pill .ic{display:inline-block;vertical-align:-5px}
.hdr{flex:none;height:34px;display:flex;gap:6px;align-items:center}
.pill{background:var(--card);border:2.5px solid var(--ol);border-radius:18px;padding:3px 10px;font-size:13px;box-shadow:0 3px 0 var(--sh);white-space:nowrap;cursor:pointer}

.bubble:empty{display:none}
.bubble::after{content:"";position:absolute;left:50%;bottom:-9px;margin-left:-7px;border:7px solid transparent;border-top-color:var(--ol);border-bottom:0}
.sm{position:absolute;z-index:2;bottom:4px;left:50%;margin-left:-72px;width:144px;height:196px;transform-origin:50% 100%;transition:transform .5s;animation:bob 2.6s ease-in-out infinite;cursor:pointer}
.sm.hop{animation:hop .5s cubic-bezier(.3,.7,.4,1)}
.sm.sleep{filter:brightness(.88)}.sm.sleep .eye{animation:none;transform:scaleY(.12)}.sm.sleep .tail,.sm.sad .tail,.sm.dead .tail{animation:none}

.ear.f{animation:sway 3.2s ease-in-out infinite}@keyframes sway{50%{rotate:3deg}}
.nose{transform-box:fill-box;transform-origin:center;animation:sniff 3s infinite}@keyframes sniff{0%,88%,100%{scale:1}93%{scale:1.25}}
.tongue{transform-box:fill-box;transform-origin:top;animation:pant .7s ease-in-out infinite}@keyframes pant{50%{scale:1 1.2}}
.ghost{animation:fl 2.4s ease-in-out infinite}@keyframes fl{50%{translate:0 -10px}}
.flag{animation:flap 2.2s ease-in-out infinite;transform-box:fill-box;transform-origin:top}@keyframes flap{50%{rotate:6deg}}

input{font:inherit;font-weight:800;width:100%;padding:8px 12px;border:3px solid var(--ol);border-radius:16px;background:var(--card);color:var(--tx);text-align:center;outline:none}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}

function tutEnd(){document.querySelectorAll('.hl').forEach(e=>e.classList.remove('hl'));$('tut').style.display='none';setTab('games');if(!S.tut){S.tut=true;S.coins+=20;toast('Держи 20 монет на старт')}render()}
$('needs').addEventListener('click',e=>{const n=e.target.closest('.nd');if(!n)return;const k=[...$('needs').children].indexOf(n),X=[['Сытость',S.food,'корми во вкладке «Уход»'],['Радость',S.fun,'играй и гладь питомца'],['Бодрость',S.rest,'уложи спать в «Уход»'],['Здоровье',S.hp,'держи остальные шкалы выше 20%'],['Чистота',S.clean,'помой питомца в «Уход»']][k];toast(X[0]+': '+Math.round(X[1])+'% — '+X[2])});
function game(kind){const left=Math.ceil(((S.cd[kind]||0)+60000-Date.now())/1000);if(left>0)return toast('Ещё '+left+' с до следующей игры');
 S.cd[kind]=Date.now();const g=$('game');g.style.display='flex';let tm;const gm=GAMES.find(x=>x[0]===kind);
 const end=()=>{clearInterval(tm);g.style.display='none';g.innerHTML='';render()};
 const frame=(t,body,dur)=>{g.innerHTML=`<div class="gc"><div class="gh"><span>${t}</span><span class="pill" id="gs">0</span></div><div class="gsub">${SUB[kind]||''}</div><div class="tb" ${dur?'':'style="display:none"'}><i id="tbar"></i></div><div class="ga" id="ga">${body}</div><button class="sec" id="gx" style="width:100%">Закрыть</button></div>`;$('gx').onclick=end;
  if(dur){const b=$('tbar');b.style.transition='none';b.style.width='100%';void b.offsetWidth;b.style.transition='width '+dur+'s linear';b.style.width='0'}};
 const score=v=>{const s=$('gs');if(s)s.textContent=v};
 const fin=(sn,fn,msg,txt,ic)=>{reward(sn,fn,msg);g.innerHTML=`<div class="gc"><div class="gh"><span>Результат</span></div><div class="ga res"><div class="big">${I(ic,84)}</div><div class="rt">${txt}</div><div class="rs">+${sn} монет · +${fn} радости</div></div><button id="gx" style="width:100%">Отлично</button></div>`;$('gx').onclick=end};
 if(kind==='catch'){let sc=0,n=0;frame('Звёздочки','',12);const ga=$('ga');
  tm=setInterval(()=>{if(n>=24){clearInterval(tm);return fin(Math.min(24,sc),Math.min(60,sc*3),'Здорово поиграли!','Поймано '+sc,'trophy')}n++;
   const b=document.createElement('button');b.className='fl';b.innerHTML=I('star',30);b.style.left=(Math.random()*78+4)+'%';b.style.top=(Math.random()*76+4)+'%';b.onclick=()=>{sc++;score(sc);b.remove()};ga.appendChild(b);setTimeout(()=>b.remove(),1100)},500)}
 else if(kind==='memory'){const C=['#e5484d','#2e9e5b','#4aa8f5','#f1c232'],seq=Array.from({length:5},()=>Math.floor(Math.random()*4));
  frame('Память','<div class="pad">'+C.map((c,k)=>`<button class="pd" data-k="${k}" style="background:${c}"></button>`).join('')+'</div><div class="hint" id="mh">Запоминай…</div>');
  const pads=[...$('ga').querySelectorAll('.pd')];let j=0,p=0,inp=false;const flash=k=>{pads[k].classList.add('lit');setTimeout(()=>pads[k].classList.remove('lit'),350)};
  tm=setInterval(()=>{if(j>=seq.length){clearInterval(tm);inp=true;$('mh').textContent='Повтори!';return}flash(seq[j++])},700);
  $('ga').onclick=e=>{const b=e.target.closest('.pd');if(!b||!inp)return;const k=+b.dataset.k;flash(k);
   if(k===seq[p]){p++;score(p);if(p>=seq.length){inp=false;setTimeout(()=>fin(25,20,'Память как у слона!','Все 5!','star'),500)}}else{inp=false;setTimeout(()=>fin(p*4,5,'Ой, ошибся','Ошибка на шаге '+(p+1),'cloud'),500)}}}
 else if(kind==='whack'){let hits=0,n=0,cur=-1;const face=`<svg viewBox="40 -10 130 150" width="56" height="64">${petInner(S.pet,S.color,{})}</svg>`;frame('Кто выглянул?','<div class="holes">'+Array.from({length:9},()=>'<button class="hole"></button>').join('')+'</div>',15);const hs=[...$('ga').querySelectorAll('.hole')];
  hs.forEach((b,i)=>b.onclick=()=>{if(i===cur){hits++;score(hits);cur=-1;b.innerHTML=I('sparkle',34)}});
  tm=setInterval(()=>{hs.forEach(h=>h.innerHTML='');if(n>=20){clearInterval(tm);return fin(Math.min(25,Math.round(hits*1.3)),hits*3,'Классная реакция!','Попал '+hits,'trophy')}n++;cur=Math.floor(Math.random()*9);hs[cur].innerHTML=face},750)}
 else if(kind==='math'){let q=0,ok=0;const ask=()=>{if(q>=5)return fin(ok*4,ok*4,'Математик!','Верно '+ok+'/5','calc');
   const a=2+Math.floor(Math.random()*8),b=2+Math.floor(Math.random()*8),r=a+b,o=[r,r+1+Math.floor(Math.random()*3),r-1-Math.floor(Math.random()*2)].sort(()=>Math.random()-.5);
   frame('Счёт '+(q+1)+'/5','<div class="q">'+I('cookie',30).repeat(a)+'<b>+</b>'+I('cookie',30).repeat(b)+'</div><div style="padding-top:30px">'+o.map(x=>`<button class="gbig" data-v="${x}">${x}</button>`).join('')+'</div>');score(ok);
   $('ga').onclick=e=>{const bt=e.target.closest('button');if(!bt)return;if(+bt.dataset.v===r)ok++;q++;ask()}};ask()}
 else if(kind==='cups'){frame('Где подарок?','<div class="cups">'+[0,1,2].map(i=>`<button class="cup" data-i="${i}">${I('cup',46)}</button>`).join('')+'</div><div class="hint">Выбери стаканчик</div>');const w=Math.floor(Math.random()*3);
  $('ga').onclick=e=>{const b=e.target.closest('.cup');if(!b)return;$('ga').onclick=null;const win=+b.dataset.i===w;b.innerHTML=I(win?'gift':'cloud',46);setTimeout(()=>win?fin(15,25,'Угадал!','Угадал!','gift'):fin(3,8,'Почти!','Не угадал','cup'),700)}}
 else{let x=0,dir=1,hits=0,thr=0;frame('Меткий бросок','<div class="mt"><div class="z"></div><div class="p" id="pp"></div></div><div class="hint">Жми, когда метка в зелёной зоне</div><button id="th">Бросить (5)</button>');
  tm=setInterval(()=>{x+=dir*3.2;if(x>=92||x<=0)dir*=-1;$('pp').style.left=x+'%'},30);
  $('th').onclick=()=>{thr++;const hit=x>=38&&x<=58;if(hit)hits++;score(hits);$('th').textContent='Бросить ('+(5-thr)+')';toast(hit?'Попал!':'Мимо!');if(thr>=5){clearInterval(tm);$('th').disabled=true;setTimeout(()=>fin(hits*5,hits*8,'Меткий бросок!','Попаданий '+hits+'/5','ball'),400)}}}}
function dailyBonus(){const t=new Date().toDateString();if(S.pet&&S.day!==t){S.day=t;S.coins+=25;setTimeout(()=>toast('Ежедневный подарок: +25 монет'),900)}}
$('sm').addEventListener('touchstart',()=>{},{passive:true});
if(S.pet){const n=Math.min(1800,Math.floor((Date.now()-S.last)/2000));if(n>5)tick(n,.5);if(!$('say').textContent)say(pick(PETS[S.pet].say),1)}
setInterval(()=>{if(!S.pet)return;dailyBonus();if(!S.dead){const was=S.sleep;tick(1,1);
 if(was&&!S.sleep)say('Выспался! Доброе утро',1);else if(S.sleep)say('Zzz…',1);else if(Math.random()<.4){if(S.hp<20)say('Спасите, мне очень плохо!');else if(S.hp<40)say('Мне плохо…');else if(S.food<25)say('Я голодный!');else if(S.fun<25)say('Мне скучно…');else if(S.rest<25)say('Хочу спать');else if(S.clean<25)say('Хочу помыться');else say(pick(PETS[S.pet].say))}}render()},2000);
setInterval(()=>{if(tab==='games'&&!S.dead)updGames()},1000);
if(!S.pet)openPicker();else render();
</script></body></html>
